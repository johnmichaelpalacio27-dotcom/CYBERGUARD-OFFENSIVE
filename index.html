<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance - Exchange Simulator</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #181a20;
            --card-bg: #0b0e11;
            --accent-yellow: #fcd535;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --green: #0ecb81;
            --red: #f6465d;
            --border-color: #2b313a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 64px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area img {
            width: 32px;
        }

        .logo-area span {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent-yellow);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .wallet-balance {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .wallet-balance span {
            color: var(--accent-yellow);
            font-weight: bold;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-login {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-register {
            background-color: var(--accent-yellow);
            color: #000;
        }

        /* Contenedor Principal de Trading */
        .trade-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            height: calc(100vh - 64px);
            background-color: var(--bg-color);
        }

        /* Panel Izquierdo: Mercados */
        .market-sidebar {
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-search {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-search input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 10px;
            color: var(--text-primary);
            outline: none;
            font-size: 13px;
        }

        .coin-list {
            overflow-y: auto;
            flex: 1;
        }

        .coin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(43, 49, 58, 0.4);
            font-size: 13px;
        }

        .coin-item:hover, .coin-item.active {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .coin-info-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-info-left img {
            width: 20px;
            height: 20px;
        }

        /* Panel Central: Gráfico y Ordenes abiertas */
        .center-panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .chart-container {
            flex: 2;
            width: 100%;
            background: var(--card-bg);
        }

        .orders-container {
            flex: 1;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 16px;
            overflow-y: auto;
        }

        .orders-container h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
        }

        /* Panel Derecho: Operaciones (Trading Form) */
        .trade-panel {
            background-color: var(--card-bg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .trade-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .tab-btn.active.buy { color: var(--green); }
        .tab-btn.active.sell { color: var(--red); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
        }

        .input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-buy { background-color: var(--green); color: #000; }
        .btn-sell { background-color: var(--red); color: #fff; }

        .positive { color: var(--green); }
        .negative { color: var(--red); }

        /* Modal de Autenticación (Login / Registro) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-content h2 {
            color: var(--accent-yellow);
            font-size: 20px;
            margin-bottom: 5px;
        }

        .close-modal {
            align-self: flex-end;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <header>
        <div class="logo-area">
            <img src="https://cryptologos.cc/logos/binance-coin-bnb-logo.svg?v=025" alt="Binance Logo">
            <span>BINANCE</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Trade</a></li>
                <li><a href="#">Mercados</a></li>
                <li><a href="#">Futuros</a></li>
                <li><a href="#">Earn</a></li>
            </ul>
        </nav>
        <div class="user-menu" id="userMenu">
            <div class="wallet-balance">Saldo: $<span id="userBalance">10,000.00</span> USDT</div>
            <button class="btn btn-login" onclick="openModal('loginModal')">Iniciar Sesión</button>
            <button class="btn btn-register" onclick="openModal('registerModal')">Registrarse</button>
        </div>
    </header>

    <!-- Layout de Trading -->
    <div class="trade-layout">
        
        <!-- Panel Izquierdo: Lista de Criptomonedas -->
        <div class="market-sidebar">
            <div class="sidebar-search">
                <input type="text" id="coinSearch" placeholder="Buscar par (ej. BTC)">
            </div>
            <div class="coin-list" id="coinList">
                <!-- Se llena mediante JS -->
            </div>
        </div>

        <!-- Panel Central: Gráfico y Registro de Órdenes -->
        <div class="center-panel">
            <div class="chart-container" id="tradingview_widget">
                <!-- Gráfico de TradingView en Vivo -->
            </div>
            <div class="orders-container">
                <h3>Historial de Órdenes Simuladas</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Par</th>
                            <th>Tipo</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No hay operaciones recientes</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Panel Derecho: Comprar / Vender -->
        <div class="trade-panel">
            <div class="trade-tabs">
                <button class="tab-btn active buy" onclick="setTradeType('buy')">Comprar</button>
                <button class="tab-btn sell" onclick="setTradeType('sell')">Vender</button>
            </div>
            
            <div class="form-group">
                <label>Precio Actual (<span id="activeSymbolLabel">BTC</span>)</label>
                <div class="input-wrapper">
                    <input type="text" id="currentPriceInput" readonly value="64,230.50">
                    <span style="font-size: 12px; color: var(--text-secondary);">USDT</span>
                </div>
            </div>

            <div class="form-group">
                <label>Cantidad</label>
                <div class="input-wrapper">
                    <input type="number" id="tradeAmount" placeholder="0.00" step="0.001" oninput="calculateTotal()">
                </div>
            </div>

            <div class="form-group">
                <label>Total Estimado</label>
                <div class="input-wrapper">
                    <input type="text" id="tradeTotal" readonly value="0.00">
                    <span style="font-size: 12px; color: var(--text-secondary);">USDT</span>
                </div>
            </div>

            <button class="btn-action btn-buy" id="actionBtn" onclick="executeTrade()">Comprar BTC</button>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
            <h2>Iniciar Sesión</h2>
            <div class="form-group">
                <label>Correo electrónico</label>
                <div class="input-wrapper"><input type="email" placeholder="nombre@correo.com"></div>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper"><input type="password" placeholder="••••••••"></div>
            </div>
            <button class="btn btn-register" style="margin-top: 10px;" onclick="simulateLogin('Usuario Demo')">Entrar</button>
        </div>
    </div>

    <!-- Modal Registro -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('registerModal')">&times;</span>
            <h2>Crear Cuenta</h2>
            <div class="form-group">
                <label>Correo electrónico</label>
                <div class="input-wrapper"><input type="email" placeholder="nombre@correo.com"></div>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper"><input type="password" placeholder="••••••••"></div>
            </div>
            <button class="btn btn-register" style="margin-top: 10px;" onclick="simulateLogin('Nuevo Usuario')">Registrarse</button>
        </div>
    </div>

    <!-- Script de TradingView para Gráficos en Vivo -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let currentSymbol = "BTCUSDT";
        let currentPrice = 64230.50;
        let tradeType = "buy";
        let userBalance = 10000.00;
        let tvWidget = null;

        const coins = [
            { symbol: "BTCUSDT", name: "BTC", tv: "BINANCE:BTCUSDT", price: 64230.50, change: 2.45, icon: "https://cryptologos.cc/logos/bitcoin-btc-logo.svg?v=025" },
            { symbol: "ETHUSDT", name: "ETH", tv: "BINANCE:ETHUSDT", price: 3450.20, change: -1.12, icon: "https://cryptologos.cc/logos/ethereum-eth-logo.svg?v=025" },
            { symbol: "BNBUSDT", name: "BNB", tv: "BINANCE:BNBUSDT", price: 580.00, change: 5.80, icon: "https://cryptologos.cc/logos/binance-coin-bnb-logo.svg?v=025" },
            { symbol: "SOLUSDT", name: "SOL", tv: "BINANCE:SOLUSDT", price: 145.80, change: 3.21, icon: "https://cryptologos.cc/logos/solana-sol-logo.svg?v=025" },
            { symbol: "ADAUSDT", name: "ADA", tv: "BINANCE:ADAUSDT", price: 0.38, change: -0.45, icon: "https://cryptologos.cc/logos/cardano-ada-logo.svg?v=025" }
        ];

        // Inicializar Gráfico de TradingView
        function initChart(symbolTV) {
            document.getElementById('tradingview_widget').innerHTML = "";
            tvWidget = new TradingView.widget({
                "autosize": true,
                "symbol": symbolTV,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "es",
                "toolbar_bg": "#181a20",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "container_id": "tradingview_widget"
            });
        }

        // Renderizar lista lateral de criptomonedas
        function renderCoinList(filter = "") {
            const listContainer = document.getElementById('coinList');
            listContainer.innerHTML = "";
            
            coins.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(coin => {
                const isSelected = coin.symbol === currentSymbol ? "active" : "";
                const changeClass = coin.change >= 0 ? "positive" : "negative";
                const changeSign = coin.change >= 0 ? "+" : "";

                const item = document.createElement('div');
                item.className = `coin-item ${isSelected}`;
                item.innerHTML = `
                    <div class="coin-info-left">
                        <img src="${coin.icon}" alt="${coin.name}">
                        <strong>${coin.name}/USDT</strong>
                    </div>
                    <div style="text-align: right;">
                        <div>$${coin.price.toLocaleString()}</div>
                        <div class="${changeClass}" style="font-size: 11px;">${changeSign}${coin.change}%</div>
                    </div>
                `;
                item.onclick = () => selectCoin(coin);
                listContainer.appendChild(item);
            });
        }

        function selectCoin(coin) {
            currentSymbol = coin.symbol;
            currentPrice = coin.price;
            document.getElementById('currentPriceInput').value = currentPrice.toLocaleString();
            document.getElementById('activeSymbolLabel').innerText = coin.name;
            initChart(coin.tv);
            renderCoinList(document.getElementById('coinSearch').value);
        }

        // Búsqueda en sidebar
        document.getElementById('coinSearch').addEventListener('input', (e) => {
            renderCoinList(e.target.value);
        });

        // Cambiar entre pestaña Comprar / Vender
        function setTradeType(type) {
            tradeType = type;
            const buyTab = document.querySelector('.tab-btn.buy');
            const sellTab = document.querySelector('.tab-btn.sell');
            const actionBtn = document.getElementById('actionBtn');

            if(type === 'buy') {
                buyTab.classList.add('active');
                sellTab.classList.remove('active');
                actionBtn.className = "btn-action btn-buy";
                actionBtn.innerText = `Comprar ${document.getElementById('activeSymbolLabel').innerText}`;
            } else {
                sellTab.classList.add('active');
                buyTab.classList.remove('active');
                actionBtn.className = "btn-action btn-sell";
                actionBtn.innerText = `Vender ${document.getElementById('activeSymbolLabel').innerText}`;
            }
        }

        // Calcular total según cantidad introducida
        function calculateTotal() {
            const amount = parseFloat(document.getElementById('tradeAmount').value) || 0;
            const total = amount * currentPrice;
            document.getElementById('tradeTotal').value = total.toFixed(2);
        }

        // Ejecutar Operación Simulada
        function executeTrade() {
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            const total = amount * currentPrice;

            if(!amount || amount <= 0) {
                alert("Por favor introduce una cantidad válida.");
                return;
            }

            if(tradeType === 'buy') {
                if(userBalance < total) {
                    alert("Saldo insuficiente en tu cuenta USDT.");
                    return;
                }
                userBalance -= total;
            } else {
                userBalance += total;
            }

            document.getElementById('userBalance').innerText = userBalance.toLocaleString('en-US', {minimumFractionDigits: 2});

            // Añadir a la tabla de órdenes
            const tbody = document.getElementById('ordersTableBody');
            if(tbody.innerHTML.includes('No hay operaciones')) tbody.innerHTML = "";

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${document.getElementById('activeSymbolLabel').innerText}/USDT</td>
                <td class="${tradeType === 'buy' ? 'positive' : 'negative'}">${tradeType === 'buy' ? 'COMPRA' : 'VENTA'}</td>
                <td>$${currentPrice.toLocaleString()}</td>
                <td>${amount}</td>
                <td>$${total.toFixed(2)}</td>
            `;
            tbody.prepend(row);
            document.getElementById('tradeAmount').value = "";
            document.getElementById('tradeTotal').value = "0.00";
            alert("¡Operación ejecutada con éxito!");
        }

        // Modales de Autenticación
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function simulateLogin(username) {
            closeModal('loginModal');
            closeModal('registerModal');
            document.getElementById('userMenu').innerHTML = `
                <div class="wallet-balance">Hola, <b>${username}</b> | Saldo: $<span id="userBalance">${userBalance.toLocaleString('en-US', {minimumFractionDigits: 2})}</span> USDT</div>
            `;
        }

        // Inicializar al cargar
        renderCoinList();
        initChart("BINANCE:BTCUSDT");
    </script>
</body>
</html>
